name: precheck

on:
  push:
    branches: [ POLARDB_15_STABLE ]
    paths:
      - '.github/workflows/precheck.yml'
      - '.ci/**'
      - 'config/**'
      - 'contrib/**'
      - 'external/**'
      - 'src/**'
      - 'configure*'
      - 'build.sh'
  pull_request:
    branches: [ POLARDB_15_STABLE ]
    paths:
      - '.github/workflows/precheck.yml'
      - '.ci/**'
      - 'config/**'
      - 'contrib/**'
      - 'external/**'
      - 'src/**'
      - 'configure*'
      - 'build.sh'
  # Manual trigger - runs all matrix combinations
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container_image: [ rocky8, rocky9, ubuntu22.04 ]
        rules: [ precheck-main-check, plcheck ]
        debug_mode: [ on, off ]
    steps:
      - name: fetch source code
        uses: actions/checkout@v4

      - name: build and test
        run: |
          .ci/ci-test.sh \
            "${{ matrix.container_image }}" \
            "${{ matrix.debug_mode }}" \
            "${{ matrix.rules }}"
