name: forward-merge

# Every change to a stable branch must also reach the higher ones
# (POLARDB_15_STABLE -> POLARDB_17_STABLE). This checks that the forward-merge
# of a pull request will go through; see .ci/forward-merge/forward-merge.sh.

on:
  pull_request:
    branches: [ 'POLARDB_*_STABLE' ]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

jobs:
  can-forward-merge:
    name: Can Forward Merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check the forward-merge to the next stable branch
        env:
          FORWARD_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: >-
          .ci/forward-merge/check-can-forward-merge.sh
          "${{ github.base_ref }}"
          "${{ github.event.pull_request.head.sha }}"
