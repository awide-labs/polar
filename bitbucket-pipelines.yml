# bitbucket-pipelines.yml
image: atlassian/default-image:latest

definitions:
  services:
    docker:
      memory: 6144  # Increased to 6GB to handle build memory requirements

  step-template: &base-step-template
    size: 2x  # Increased from default 1x to 2x (4 cores, 8192MB)
    services:
      - docker
    caches:
      - docker

  changeset-paths: &changeset-paths
    includePaths:
      - "bitbucket-pipelines.yml"
      - ".ci/**"
      - "config/**"
      - "contrib/**"
      - "external/**"
      - "src/**"
      - "configure*"
      - "build.sh"

  build-test-script: &build-test-script |
    # Building and testing
    # Count total combinations to determine if cleanup is needed
    set -euo pipefail
    container_count=0
    for container_image in ${CONTAINER_IMAGES}; do
      for debug_mode in ${DEBUG_MODES}; do
        container_count=$((container_count + 1))
      done
    done
    # Run containers, only cleanup intermediate ones (not the last)
    current=0
    for container_image in ${CONTAINER_IMAGES}; do
      for debug_mode in ${DEBUG_MODES}; do
        current=$((current + 1))
        # Enable cleanup only if this is not the last container
        if [ $current -lt $container_count ]; then
          CLEANUP_FLAG="true"
        else
          CLEANUP_FLAG="false"
        fi
        .ci/ci-test.sh "$container_image" "$debug_mode" "$RULES" "$CLEANUP_FLAG"
      done
    done

pipelines:
  branches:
    POLARDB_15_STABLE:
      - step:
          <<: *base-step-template
          name: Main branch push trigger
          condition:
            changesets: *changeset-paths
          script:
            - |
              export CONTAINER_IMAGES="rocky9 ubuntu24.04"
              export DEBUG_MODES="off"
              export RULES="precheck-ci"
            - *build-test-script

  # Pull request trigger
  pull-requests:
    '**':  # Run on all pull requests
      - step:
          <<: *base-step-template
          name: Pull request trigger
          condition:
            changesets: *changeset-paths
          script:
            - |
              export CONTAINER_IMAGES="rocky9"
              export DEBUG_MODES="on"
              export RULES="precheck-ci"
            - *build-test-script

  # Manual trigger
  custom:
    manual:
      - variables:
          - name: CONTAINER_IMAGES
            default: rocky9
          - name: DEBUG_MODES
            default: "on"
            allowed-values:
              - "on"
              - "off"
              - "on off"
          - name: RULES
            default: precheck-ci
      - step:
          <<: *base-step-template
          name: Manual trigger
          script:
            - *build-test-script
